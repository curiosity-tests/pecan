name: check

on:
  workflow_call:
    inputs:
      chalk_on:
        description: "racecar: instrumented arm switch, passed down by the caller"
        type: string
        default: "false"
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      R-version:
        required: true
        type: string
      make-grouping:
        required: true
        type: string

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.chalk_on }}
  R_LIBS_USER: /usr/local/lib/R/site-library
  LC_ALL: en_US.UTF-8
  NCPUS: 2
  PGHOST: postgres
  CI: true

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_LENGTH_1_LOGIC2_: true
      # Avoid compilation check warnings that come from the system Makevars
      # See https://stat.ethz.ch/pipermail/r-package-devel/2019q2/003898.html
      _R_CHECK_COMPILATION_FLAGS_KNOWN_: -Wformat -Werror=format-security -Wdate-time
      # Keep R checks from trying to consult the very flaky worldclockapi.com
      _R_CHECK_SYSTEM_CLOCK_: 0

    container: 
      image: pecan/depends:develop-R${{ inputs.R-version }}

    steps:
    # checkout source code
    - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
      shell: sh
      run: |
        command -v curl >/dev/null 2>&1 && command -v bash >/dev/null 2>&1 && exit 0
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates bash
        elif command -v apk >/dev/null 2>&1; then apk add --no-cache curl ca-certificates bash
        elif command -v dnf >/dev/null 2>&1; then dnf install -y curl ca-certificates bash
        elif command -v yum >/dev/null 2>&1; then yum install -y curl ca-certificates bash
        elif command -v zypper >/dev/null 2>&1; then zypper -n install curl ca-certificates bash
        fi

    - name: work around https://github.com/actions/checkout/issues/766
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        set-safe-directory: false

    # Forbid spaces in names. Yes, *we* know it's not 1980 anymore, but Make doesn't.
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - name: check for filenames that would confuse Make
      run: |
        SPACENAMES=`find . -name '* *'`
        if [ -n "$SPACENAMES" ]; then
          echo "::error file=${SPACENAMES}::Spaces in filename(s): ${SPACENAMES}. Please rename these files by converting spaces to underscores."
          exit 1
        fi

    # install additional tools needed
    - name: install utils
      run: apt-get update && apt-get install -y postgresql-client qpdf
    - name: install new dependencies
      run: Rscript scripts/generate_dependencies.R && cd docker/depends && Rscript pecan.depends.R

    # run PEcAn checks
    # The package names of base, modules, and models are passed as matrix variables to avoid repeatability of code
    - name: check
      run: make -j1 ${{ inputs.make-grouping }}
      env:
        REBUILD_DOCS: "FALSE"
        RUN_TESTS: "FALSE"

    - name: check for out-of-date files
      uses: infotroph/tree-is-clean@v1

    - name: check package versions
      run: |
        tag=$(\
          curl -s https://api.github.com/repos/PecanProject/pecan/releases/latest \
          | sed -n 's!.*"tag_name": "\(.*\)".*!\1!p')
        git fetch https://github.com/PecanProject/pecan.git "refs/tags/${tag}:refs/tags/${tag}" --depth=1
        ./scripts/ensure_version_bump.sh "$tag"
